version: '3.8'

# ============================================
# CODEMED HUB — Docker Compose (Producao)
# Uso: docker-compose up -d
# ============================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: codemed-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: codemed
      POSTGRES_PASSWORD: codemed123
      POSTGRES_DB: codemed_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codemed']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codemed-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codemed-backend
    restart: unless-stopped
    ports:
      - '3010:3010'
    environment:
      DATABASE_URL: postgresql://codemed:codemed123@postgres:5432/codemed_hub?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production}
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3010
      PORT: '3010'
      NODE_ENV: production
      TIMEZONE: America/Fortaleza
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codemed-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
