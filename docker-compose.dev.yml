version: '3.8'

# ============================================
# CODEMED HUB — Docker Compose (Desenvolvimento)
# Uso: docker-compose -f docker-compose.dev.yml up -d
# Apenas infraestrutura (PostgreSQL + Redis)
# App roda local com: dev.bat
# ============================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: codemed-postgres-dev
    restart: unless-stopped
    # 5437: 5432/5435 ja estao ocupados pelo PostgreSQL NATIVO do Windows
    ports:
      - '5437:5432'
    environment:
      POSTGRES_USER: codemed
      POSTGRES_PASSWORD: codemed123
      POSTGRES_DB: codemed_hub
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codemed']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codemed-redis-dev
    restart: unless-stopped
    # 6381: 6379 (evolution-redis) e 6380 (lead-system) ja estao em uso
    ports:
      - '6381:6379'
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
  redis_data_dev:
