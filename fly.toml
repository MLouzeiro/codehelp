# =============================================================================
# fly.toml — CodeHelp Backend (Fly.io)
# Configuracao para deploy automatico
# =============================================================================

app = "codehelp-backend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3010"
  NODE_ENV = "production"

[http_service]
  internal_port = 3010
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "storage"
  destination = "/app/storage"
